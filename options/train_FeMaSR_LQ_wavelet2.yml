# ==================== WAVELET-VQ LQ CONFIG: 新增的双码本超分配置 ====================
# general settings
name: 015_FeMaSR_LQ_wavelet2
# name: debug_FeMaSR
model_type: FeMaSRModel
scale: &upscale 4
num_gpu: 1 # 单张 4090；训练步数与数据配置沿用官方文件，另行确定实验预算。
manual_seed: 0

# dataset and data loader settings
datasets:
  train:
    name: General_Image_Train
    # type: BSRGANTrainDataset
    # dataroot_gt: ../datasets/HQ_sub
    type: PairedImageDataset
    # >>> WAVELET-VQ CHANGE 23 BEGIN: official paired DIV2K x4, no second resize.
    dataroot_gt: ../datasets/DF2K_official/train_HR
    dataroot_lq: ../datasets/DF2K_official/train_LR_x4
    paired_by_stem: true
    align_gt_to_lq: true
    paired_crop_only: true
    io_backend:
      type: disk

    gt_size: 256
    use_resize_crop: false
    use_flip: true
    use_rot: true

    # data loader
    use_shuffle: true
    batch_size_per_gpu: &bsz 8
    num_worker_per_gpu: *bsz
    dataset_enlarge_ratio: 1

    prefetch_mode: cpu
    num_prefetch_queue: *bsz
    # <<< WAVELET-VQ CHANGE 23 END

  val:
    name: General_Image_Valid
    type: PairedImageDataset
    dataroot_gt: ../datasets/DF2K_official/val_HR
    dataroot_lq: ../datasets/DF2K_official/val_LR_x4
    paired_by_stem: true
    align_gt_to_lq: true
    crop_eval_size: 512
    eval_crop_mode: center
    io_backend:
      type: disk

# network structures
network_g:
  type: FeMaSRNet
  gt_resolution: 256
  norm_type: 'gn'
  act_type: 'silu'
  scale_factor: *upscale
  # [WaveletVQ] 必须与 HQ 阶段相同：LL2 码本 + D1/D2 共享高频码本。
  codebook_params:
    - [32, 512, 512]
  wavelet_vq: true
  detail_codebook_size: 512

  LQ_stage: true
  frozen_module_keywords: ['quantize', 'decoder', 'after_quant_group', 'out_conv']

network_d:
  type: UNetDiscriminatorSN
  num_in_ch: 3

# path
path:
  # 只能加载本项目新训练的双码本 HQ 权重，不能沿用官方单码本 HQ 权重。
  pretrain_network_hq: ./experiments/008_FeMaSR_HQ_wavelet2/models/net_g_200000.pth
  pretrain_network_g: ~
  pretrain_network_d: ./experiments/pretrained_models/FeMaSR_HRP_model_d.pth
  strict_load: false # HQ 的可选语义模块与 LQ 教师不同；代码会单独严格检查两个码本。
  # resume_state: ~

# training settings
train:
  optim_g:
    type: Adam
    lr: !!float 1e-4
    weight_decay: 0
    betas: [0.9, 0.99]
  optim_d:
    type: Adam
    lr: !!float 4e-4
    weight_decay: 0
    betas: [0.9, 0.99]

  scheduler:
    type: MultiStepLR
    # milestones: [50000, 100000, 200000, 300000]
    # gamma: 1
    milestones: [50000, 100000, 150000, 200000, 250000, 300000, 350000]
    gamma: 1

  total_iter: 200000
  warmup_iter: -1  # no warm up

  # losses
  pixel_opt:
    type: L1Loss
    loss_weight: 1.0
    reduction: mean

  perceptual_opt:
    type: LPIPSLoss
    loss_weight: !!float 1.0

  gan_opt:
    type: GANLoss
    gan_type: hinge
    real_label_val: 1.0
    fake_label_val: 0.0
    loss_weight: 0.1

  codebook_opt:
    loss_weight: 1.0

  semantic_opt:
    loss_weight: 0.1

  net_d_iters: 1
  net_d_init_iters: !!float 0

# validation settings·
val:
  val_freq: !!float 5e3
  save_img: true
  save_img_max_samples: 4 # 每次验证只保存前四张 SR 图，完整 100 张仍参与指标计算。
  save_img_full_freq: 50000 # 每 50k 步保存一次全部 100 张，控制长期磁盘占用。
  wavelet_vis_max_samples: 1 # 每轮验证保存首张样本的 LL2 和 D2 量化前/后图。
  wavelet_vis_save_raw: false

  key_metric: lpips
  metrics:
    psnr: # metric name, can be arbitrary
      type: psnr
      crop_border: 4
      test_y_channel: true
    ssim:
      type: ssim
      crop_border: 4
      test_y_channel: true
    lpips:
      type: lpips
      better: lower

# logging settings
logger:
  print_freq: 100
  save_checkpoint_freq: !!float 5e3 # 保存模型+优化器状态，可断点续训。
  save_latest_freq: !!float 5e3
  keep_last_checkpoints: 3
  show_tf_imgs_freq: !!float 1e3
  use_tb_logger: true

# wandb:
    # project: ESRGAN
    # resume_id: ~

# dist training settings
dist_params:
  backend: nccl
  port: 16500 #29500

find_unused_parameters: true
